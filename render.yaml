# Public LinkedIn demo. Laya stays off (too heavy for a small web instance).
# Jev + Gemini keys are set in the Render dashboard, not in this file.
services:
  - type: web
    name: actgate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LAYA_ENABLED
        value: "false"
      - key: LAYA_PRELOAD
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/actgate.db
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TYPESAFE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
